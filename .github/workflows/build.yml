name: Build CurseDeck
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/demo_smoke.py
  package:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frontend dependencies
        run: npm ci
      - run: npm run test:frontend
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: CurseDeck-test-build
          path: |
            out/CurseDeck.zip
            package-lock.json
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            out/CurseDeck.zip
            out/update.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/CurseDeck.zip release-assets/update.json --verify-tag --title "CurseDeck $RELEASE_TAG" --notes-file RELEASE_NOTES.md --latest
